INIT Init
NEXT Next

\* TLC cannot parse a config supplied via bash process substitution
\* (/dev/fd/63), so CONSTANTS must live in a real file next to the spec.
CONSTANTS
  Lanes = { "GOES_MAG", "DSCOVR_MAG" }
  MaxDrift = 30
  MaxJitter = 12
  StepUnit = 1
  WatchdogSec = 30
  PollInterval = 10
  MaxBackoff = 300
  DefaultCap = 15
  buggy = FALSE

INVARIANT TypeOK
INVARIANT DriftBounded
PROPERTY MonotonicTime
