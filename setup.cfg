# Mutation-testing runner for CI.
#
# Strategy: mutate ONLY sts_noaa_telemetry_agent.py, and validate each mutant
# against a dedicated pytest harness (tests/test_mutation_harness.py) that
# exercises the pure/IO functions with time.sleep mocked out — so no mutant
# can survive by making the suite hang, and every mutant gets a fast verdict.

[mutmut]
paths_to_mutate=sts_noaa_telemetry_agent.py
runner=python -m pytest -x -q --no-header tests/test_mutation_harness.py
tests_dir=tests/
